<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Sorting Assistant</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e5f7e5 0%, #f0f8ff 100%);
            color: #1f2937;
        }

        .page-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 2rem;
            letter-spacing: -0.03em;
            color: #0f4c3f;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #475569;
            line-height: 1.6;
        }

        .form-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        button:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        .result-box {
            padding: 22px;
            border-radius: 18px;
            background: #f8fafc;
            border: 1px solid #d1d5db;
            margin-top: 24px;
        }

        .result-box h3 {
            margin: 0 0 14px;
            color: #134e4a;
        }

        .result-box p {
            margin: 8px 0;
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 700;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .tag.organik {
            background: #d1fae5;
            color: #065f46;
        }

        .tag.anorganik {
            background: #fef9c3;
            color: #92400e;
        }

        .tag.b3 {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="card">
            <h1>Smart Waste Sorting</h1>
            <p class="subtitle">Masukkan jenis sampah untuk mendapatkan kategori dan rekomendasi pembuangan.</p>

            <form method="POST">
                <div class="form-group">
                    <input type="text" name="waste" placeholder="Masukkan jenis sampah..." required>
                    <button type="submit">Klasifikasi</button>
                </div>
            </form>

            {% if result %}
                <div class="result-box">
                    <h3>Hasil:</h3>
                    <p><strong>Input:</strong> {{ result.input }}</p>
                    <p><strong>Kategori:</strong>
                        <span class="tag {% if result.category == 'Organik' %}organik{% elif result.category == 'Anorganik' %}anorganik{% elif result.category == 'B3' %}b3{% endif %}">
                            {{ result.category }}
                        </span>
                    </p>
                    <p><strong>Rekomendasi:</strong> {{ result.recommendation }}</p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
